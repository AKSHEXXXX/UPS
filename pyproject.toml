[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coldchain-gym"
version = "0.1.0"
description = "ColdChain OpenEnv environment"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.2",
    "numpy>=1.24.0",
    "networkx>=3.0",
    "matplotlib>=3.7.0",
    "gymnasium>=0.29.0",
    "sb3-contrib>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m gym.server.app
server = "gym.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["gym", "gym.server"]
package-dir = { "gym" = ".", "gym.server" = "server" }