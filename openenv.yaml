spec_version: 1
name: UPS
type: space
runtime: fastapi
app: server.app:app
port: 8000
tasks:
  - id: easy
    name: Easy Tier
    difficulty: easy
    reward_function: easy
    graders:
      - name: BasicGrader
        entrypoint: core.graders.basic_grader:BasicGrader

  - id: moderate
    name: Moderate Tier
    difficulty: moderate
    reward_function: moderate
    graders:
      - name: ModerateGrader
        entrypoint: core.graders.moderate_grader:ModerateGrader

  - id: hard
    name: Hard Tier
    difficulty: hard
    reward_function: hard
    graders:
      - name: HardGrader
        entrypoint: core.graders.hard_grader:HardGrader

  - id: extreme
    name: Extreme Tier
    difficulty: extreme
    reward_function: extreme
    graders:
      - name: HardEmergencyCaseGrader
        entrypoint: core.graders.hard_emergency:HardEmergencyCaseGrader
