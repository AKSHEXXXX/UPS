spec_version: 1
name: UPS
type: space
runtime: fastapi
app: server.app:app
port: 8000
tasks:
  - id: easy
    name: Easy Tier
    description: Easy cold-chain delivery objective with basic constraints.
    difficulty: easy
    reward_function: easy
    grader: core.graders.basic_grader:BasicGrader

  - id: medium
    name: Medium Tier
    description: Medium objective with higher traffic and thermal risk.
    difficulty: medium
    reward_function: medium
    grader: core.graders.moderate_grader:ModerateGrader

  - id: hard
    name: Hard Tier
    description: Hard objective with multi-shipment conflicts and tight deadlines.
    difficulty: hard
    reward_function: hard
    grader: core.graders.hard_grader:HardGrader

  - id: extreme
    name: Extreme Tier
    description: Extreme objective with emergency cases and severe constraints.
    difficulty: extreme
    reward_function: extreme
    grader: core.graders.hard_emergency:HardEmergencyCaseGrader

